keep-open=yes
save-position-on-quit=yes

profile=high-quality           # A built-in profile that sets safe, high-quality defaults
vo=gpu-next                    # The modern video output driver (requires a decent GPU)
hwdec=auto-safe                # Enable hardware decoding if available/safe
keepaspect=yes

border=no                      # remove window border (optional, good for tiling WMs)

# --- Subtitles & Audio ---
slang=eng,en                   # Prioritize English subtitles
alang=jpn,ja,eng,en            # Prioritize Japanese audio, then English
sub-auto=fuzzy                 # Load external subtitles even if the name isn't an exact match
