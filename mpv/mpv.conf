  # --- General ---
keep-open=yes
save-position-on-quit=yes
border=no

# --- Video Output & API ---
profile=high-quality           # Replaced 'gpu-hq' (deprecated in modern mpv)
vo=gpu-next                    # Modern video output driver for HDR
gpu-api=vulkan                 # FIXED: This must be 'vulkan', not 'gpu-next'
# gpu-context=waylandvk          # Native Wayland Vulkan context
keepaspect=yes

# --- Hardware Decoding ---
hwdec=nvdec-copy                   # FIXED: 'vulkan' or 'auto-safe' is vastly more stable than 'nvdec-copy' here

# --- Colorspace & HDR Metadata ---
target-prim=dci-p3
target-colorspace-hint=no     # Passes HDR metadata to Hyprland (requires Hyprland HDR patches)

# --- Subtitles & Audio ---
slang=eng,en                   # Prioritize English subtitles
alang=jpn,ja,eng,en            # Prioritize Japanese audio, then English
sub-auto=fuzzy                 # Load external subtitles even if the name isn't an exact match

# --- Scaling & Processing ---
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
dither-depth=auto

# --- HDR Profile ---
[HDR]
profile-cond=p["video-params/gamma"] == "pq"
profile-restore=copy

# FIXED: Disabled dynamic peak computation to prevent NVIDIA VRAM leaks/crashes over time.
hdr-compute-peak=no            

tone-mapping=spline
gamut-mapping-mode=auto
